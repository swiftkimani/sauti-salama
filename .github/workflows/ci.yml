name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/lcov.info, retention-days: 14 }

  migrations:
    # The PostgreSQL schema must come entirely from migrations, and the entities must not have drifted from them.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sauti, POSTGRES_PASSWORD: sauti, POSTGRES_DB: sauti }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sauti" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sauti:sauti@localhost:5432/sauti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run migration:run
      - run: npm run migration:check
      - run: npm run migration:revert

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # Fails on high or critical advisories in production dependencies. The remaining moderate ones come from
      # @nestjs/core 10 and need the NestJS 11 upgrade (see docs/RUNBOOK.md, "Dependencies").
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sauti-salama:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
