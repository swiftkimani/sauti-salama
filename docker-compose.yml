services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sauti
      POSTGRES_PASSWORD: sauti
      POSTGRES_DB: sauti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauti"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DB_TYPE: postgres
      DATABASE_URL: postgres://sauti:sauti@db:5432/sauti
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
